services:
  sharekhan-auto-trader:
    container_name: sharekhan-auto-trader-container
    build:
      context: .
      dockerfile: Dockerfile
    image: sharekhan-auto-trader
    restart: unless-stopped
    # Reserve enough capacity for the 2-vCPU / 2-GiB VM host and Docker itself.
    cpus: "2.0"
    mem_limit: 1536m
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-user-test}"
      SERVER_PORT: "${SERVER_PORT:-8080}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      MONITORING_API_TOKEN: "${MONITORING_API_TOKEN:-}"
      APP_TELEGRAM_WEBHOOK_SECRET: "${APP_TELEGRAM_WEBHOOK_SECRET:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_ANALYSIS_ENABLED: "${GEMINI_ANALYSIS_ENABLED:-true}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
      GEMINI_MAX_OUTPUT_TOKENS: "${GEMINI_MAX_OUTPUT_TOKENS:-2048}"
      GEMINI_THINKING_BUDGET: "${GEMINI_THINKING_BUDGET:-0}"
      SHOONYA_API_URL: "${SHOONYA_API_URL:-https://api.shoonya.com/NorenWClientAPI}"
      SHOONYA_OAUTH_URL: "${SHOONYA_OAUTH_URL:-https://api.shoonya.com/OAuthlogin/authorize/oauth}"
      SHOONYA_CLIENT_ID: "${SHOONYA_CLIENT_ID:-}"
      SHOONYA_SECRET_CODE: "${SHOONYA_SECRET_CODE:-}"
      SHOONYA_UID: "${SHOONYA_UID:-}"
      SHOONYA_PASSWORD: "${SHOONYA_PASSWORD:-}"
      SHOONYA_TOTP_SECRET: "${SHOONYA_TOTP_SECRET:-}"
      SHOONYA_BROWSER_HEADLESS: "${SHOONYA_BROWSER_HEADLESS:-true}"
      SHOONYA_ACCESS_TOKEN_TTL_SECONDS: "${SHOONYA_ACCESS_TOKEN_TTL_SECONDS:-28800}"
      SHOONYA_SYMBOL_MASTER_ENABLED: "${SHOONYA_SYMBOL_MASTER_ENABLED:-true}"
      SHOONYA_SYMBOL_MASTER_REFRESH_CRON: "${SHOONYA_SYMBOL_MASTER_REFRESH_CRON:-0 15 8 * * MON-FRI}"
      TZ: Asia/Kolkata
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx1024m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/dumps -Xlog:gc*:file=/app/logs/gc.log:utctime}"
      ENABLE_DEBUG: "${ENABLE_DEBUG:-false}"
      ENABLE_JMX: "${ENABLE_JMX:-false}"
      JMX_PORT: "${JMX_PORT:-9010}"
      JMX_RMI_HOSTNAME: "${JMX_RMI_HOSTNAME:-127.0.0.1}"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${LOG_DIR:-./logs}:/app/logs
      - ${DUMP_DIR:-./dumps}:/app/dumps
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
