services:
  postgres:
    image: postgres:16
    container_name: sharekhan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sharekhan}"
      POSTGRES_USER: "${POSTGRES_USER:-sharekhan_app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting PostgreSQL}"
      TZ: Asia/Kolkata
    ports:
      # Keep PostgreSQL reachable only from this host. The app will later use
      # the Docker service name "postgres" when both services run in Compose.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  sharekhan-auto-trader:
    container_name: sharekhan-auto-trader-container
    build:
      context: .
      dockerfile: Dockerfile
    image: sharekhan-auto-trader
    restart: unless-stopped
    # Reserve enough capacity for the 2-vCPU / 2-GiB VM host and Docker itself.
    cpus: "2.0"
    mem_limit: 1536m
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-user-test}"
      SERVER_PORT: "${SERVER_PORT:-8080}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      MONITORING_API_TOKEN: "${MONITORING_API_TOKEN:-}"
      APP_AUDIT_POSTGRES_ENABLED: "${APP_AUDIT_POSTGRES_ENABLED:-false}"
      APP_AUDIT_POSTGRES_BACKFILL_ON_STARTUP: "${APP_AUDIT_POSTGRES_BACKFILL_ON_STARTUP:-false}"
      APP_BACKTEST_POSTGRES_ENABLED: "${APP_BACKTEST_POSTGRES_ENABLED:-false}"
      APP_BACKTEST_POSTGRES_BACKFILL_ON_STARTUP: "${APP_BACKTEST_POSTGRES_BACKFILL_ON_STARTUP:-false}"
      APP_USER_BROKER_POSTGRES_ENABLED: "${APP_USER_BROKER_POSTGRES_ENABLED:-false}"
      APP_USER_BROKER_POSTGRES_BACKFILL_ON_STARTUP: "${APP_USER_BROKER_POSTGRES_BACKFILL_ON_STARTUP:-false}"
      APP_AUDIT_POSTGRES_URL: "${APP_AUDIT_POSTGRES_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sharekhan}}"
      APP_AUDIT_POSTGRES_USERNAME: "${APP_AUDIT_POSTGRES_USERNAME:-${POSTGRES_USER:-sharekhan_app}}"
      APP_AUDIT_POSTGRES_PASSWORD: "${APP_AUDIT_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-}}"
      APP_TELEGRAM_WEBHOOK_SECRET: "${APP_TELEGRAM_WEBHOOK_SECRET:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_ANALYSIS_ENABLED: "${GEMINI_ANALYSIS_ENABLED:-true}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
      GEMINI_MAX_OUTPUT_TOKENS: "${GEMINI_MAX_OUTPUT_TOKENS:-2048}"
      GEMINI_THINKING_BUDGET: "${GEMINI_THINKING_BUDGET:-0}"
      SHOONYA_API_URL: "${SHOONYA_API_URL:-https://api.shoonya.com/NorenWClientAPI}"
      SHOONYA_OAUTH_URL: "${SHOONYA_OAUTH_URL:-https://api.shoonya.com/OAuthlogin/authorize/oauth}"
      SHOONYA_CLIENT_ID: "${SHOONYA_CLIENT_ID:-}"
      SHOONYA_SECRET_CODE: "${SHOONYA_SECRET_CODE:-}"
      SHOONYA_UID: "${SHOONYA_UID:-}"
      SHOONYA_PASSWORD: "${SHOONYA_PASSWORD:-}"
      SHOONYA_TOTP_SECRET: "${SHOONYA_TOTP_SECRET:-}"
      SHOONYA_BROWSER_HEADLESS: "${SHOONYA_BROWSER_HEADLESS:-true}"
      SHOONYA_ACCESS_TOKEN_TTL_SECONDS: "${SHOONYA_ACCESS_TOKEN_TTL_SECONDS:-28800}"
      SHOONYA_SYMBOL_MASTER_ENABLED: "${SHOONYA_SYMBOL_MASTER_ENABLED:-true}"
      SHOONYA_SYMBOL_MASTER_REFRESH_CRON: "${SHOONYA_SYMBOL_MASTER_REFRESH_CRON:-0 15 8 * * MON-FRI}"
      TZ: Asia/Kolkata
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx1024m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/dumps -Xlog:gc*:file=/app/logs/gc.log:utctime}"
      ENABLE_DEBUG: "${ENABLE_DEBUG:-false}"
      ENABLE_JMX: "${ENABLE_JMX:-false}"
      JMX_PORT: "${JMX_PORT:-9010}"
      JMX_RMI_HOSTNAME: "${JMX_RMI_HOSTNAME:-127.0.0.1}"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${LOG_DIR:-./logs}:/app/logs
      - ${DUMP_DIR:-./dumps}:/app/dumps
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
