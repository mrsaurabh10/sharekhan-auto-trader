spring:
  profiles:
    active: user-test
  datasource:
    url: jdbc:h2:file:./data/scriptdb  # file-based for persistence
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update   # or 'create' for fresh schema every run
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    time-zone: Asia/Kolkata
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEY_STORE:}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SERVER_SSL_KEY_ALIAS:spring-boot}
logging:
  level:
    org:
      com:
        sharekhan: INFO
      hibernate:
        SQL: OFF
        type:
          descriptor:
            sql: OFF
        orm:
          jdbc:
            bind: OFF
        tool:
          hbm2ddl: ERROR
      springframework:
        orm:
          jpa: ERROR

# Application specific
app:
  backtest:
    postgres:
      # Disabled until the paired result/event backfill has been validated.
      enabled: ${APP_BACKTEST_POSTGRES_ENABLED:false}
      backfill-on-startup: ${APP_BACKTEST_POSTGRES_BACKFILL_ON_STARTUP:false}
  audit:
    postgres:
      # POC only: set APP_AUDIT_POSTGRES_ENABLED=true after PostgreSQL is healthy.
      # All non-audit persistence continues to use the primary H2 datasource.
      enabled: ${APP_AUDIT_POSTGRES_ENABLED:false}
      # Set true for one controlled startup to copy the existing H2 audit history.
      # The copy is idempotent and preserves IDs; reset it to false after validation.
      backfill-on-startup: ${APP_AUDIT_POSTGRES_BACKFILL_ON_STARTUP:false}
      url: ${APP_AUDIT_POSTGRES_URL:jdbc:postgresql://localhost:5432/sharekhan}
      username: ${APP_AUDIT_POSTGRES_USERNAME:sharekhan_app}
      password: ${APP_AUDIT_POSTGRES_PASSWORD:}
  monitoring:
    api-token: ${MONITORING_API_TOKEN:}
  scheduler:
    pool-size: ${SCHEDULER_POOL_SIZE:8}
  strategy:
    fno-0925-mover:
      # Do not compare a later breakout to the unusually high opening-auction volume.
      orb-volume-multiplier: ${FNO_0925_MOVER_ORB_VOLUME_MULTIPLIER:0.75}
      base-volume-multiplier: ${FNO_0925_MOVER_BASE_VOLUME_MULTIPLIER:1.0}
      volume-lookback: ${FNO_0925_MOVER_VOLUME_LOOKBACK:5}
      max-opposing-wick-to-range: ${FNO_0925_MOVER_MAX_OPPOSING_WICK_TO_RANGE:0.65}
      min-body-to-range: ${FNO_0925_MOVER_MIN_BODY_TO_RANGE:0.30}
      max-risk-atr-multiplier: ${FNO_0925_MOVER_MAX_RISK_ATR_MULTIPLIER:2.0}
      orb-cutoff: ${FNO_0925_MOVER_ORB_CUTOFF:11:30}
      vwap-reclaim-cutoff: ${FNO_0925_MOVER_VWAP_RECLAIM_CUTOFF:14:30}
      reclaim-base-candles: ${FNO_0925_MOVER_RECLAIM_BASE_CANDLES:3}
      reclaim-vwap-confirmations: ${FNO_0925_MOVER_RECLAIM_VWAP_CONFIRMATIONS:1}
      vwap-side-tolerance: ${FNO_0925_MOVER_VWAP_SIDE_TOLERANCE:0.001}
      vwap-direction-tolerance: ${FNO_0925_MOVER_VWAP_DIRECTION_TOLERANCE:0.0003}
      # A VWAP-base trade must be a fresh retest and expansion, not a late trend chase.
      vwap-retest-max-distance-atr: ${FNO_0925_MOVER_VWAP_RETEST_MAX_DISTANCE_ATR:0.35}
      vwap-max-extension-atr: ${FNO_0925_MOVER_VWAP_MAX_EXTENSION_ATR:1.5}
      base-break-min-atr: ${FNO_0925_MOVER_BASE_BREAK_MIN_ATR:0.20}
      session-extreme-buffer-atr: ${FNO_0925_MOVER_SESSION_EXTREME_BUFFER_ATR:0.50}
  market-data:
    # Comma-separated ISO dates, e.g. NSE_HOLIDAYS=2026-01-26,2026-03-03
    nse-holidays: ${NSE_HOLIDAYS:}
    sharekhan-quote-stale-ms: ${SHAREKHAN_QUOTE_STALE_MS:2000}
  trading:
    order-execution:
      # Exit capacity is intentionally reserved: a target/SL cannot queue behind entries.
      entry-pool-size: ${ENTRY_ORDER_EXECUTION_POOL_SIZE:4}
      exit-pool-size: ${EXIT_ORDER_EXECUTION_POOL_SIZE:4}
      entry-queue-capacity: ${ENTRY_ORDER_EXECUTION_QUEUE_CAPACITY:200}
      exit-queue-capacity: ${EXIT_ORDER_EXECUTION_QUEUE_CAPACITY:100}
      # Simulator traffic is deliberately isolated and deprioritized.
      simulator-pool-size: ${SIMULATOR_ORDER_EXECUTION_POOL_SIZE:1}
      simulator-queue-capacity: ${SIMULATOR_ORDER_EXECUTION_QUEUE_CAPACITY:50}
    entry:
      max-attempts: ${ENTRY_MAX_ATTEMPTS:5}
      retry-delay-ms: ${ENTRY_RETRY_DELAY_MS:2000}
      max-spread-percent: ${ENTRY_MAX_SPREAD_PERCENT:1.5}
      hard-spread-percent: ${ENTRY_HARD_SPREAD_PERCENT:3.5}
      wide-spread-confirmations: ${ENTRY_WIDE_SPREAD_CONFIRMATIONS:2}
      max-slippage-percent: ${ENTRY_MAX_SLIPPAGE_PERCENT:2.0}
      quote-stale-ms: ${ENTRY_QUOTE_STALE_MS:5000}
  admin:
    token: "u7Hk9jN2vP4xM8yC5wQ1aR3fT6sZ0dE9bL4gJ2hK5mN8vX1zC4qW7eR9tY3a" # REPLACE THIS WITH A STRONG SECRET IN PRODUCTION
  default-broker: SHAREKHAN
  mstock:
